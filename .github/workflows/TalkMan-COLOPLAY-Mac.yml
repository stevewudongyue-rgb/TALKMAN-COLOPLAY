name: TALKMAN COLOPLAY · Mac 测试安装包
on:
  # 默认从 GitHub 同步到公司 M2 本机构建；仅 M2 不可用时手动触发云端。
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coloplay-mac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Apple 芯片 · 构建与验证
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: 准备设备音频解码库
        run: brew install opus
      - name: 构建 Apple 芯片测试 DMG
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: python3 TalkMan-构建Mac.py --test-dmg
      - name: 检查 Wi-Fi、按键及 Mac 编辑逻辑
        run: bash TalkMan-Mac回归.command
      - name: 校验成品与 DMG
        run: TalkMan-venv-mac/bin/python TalkMan-Mac成品验收.py
      - name: 保存 Mac 安装文件
        uses: actions/upload-artifact@v4
        with:
          name: TalkMan-COLOPLAY-Mac-AppleSilicon
          path: |
            dist-mac/*.dmg
            dist-mac/TalkMan-Mac-AppleSilicon.zip
            dist-mac/TalkMan-SHA256SUMS.txt
            dist-mac/TalkMan-Mac验收.json
          if-no-files-found: error
          retention-days: 30
      - name: 保存构建诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TalkMan-COLOPLAY-Mac诊断
          path: dist-mac/*.log
          if-no-files-found: ignore
